[package]
name = "parpar-ocl"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Minimal OpenCL FFI bindings for ParPar (dlopen-based, optional)"

[dependencies]
parpar-backend = { path = "../parpar-backend" }
parpar-gf16 = { path = "../parpar-gf16" }

# FFI oracle links only on x86_64-gnu targets
[target.'cfg(all(target_env = "gnu", target_arch = "x86_64"))'.dev-dependencies]
parpar-ffi = { path = "../parpar-ffi" }
