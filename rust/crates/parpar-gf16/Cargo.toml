[package]
name = "parpar-gf16"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Rust GF(2^16) framework and kernels for ParPar"

[dependencies]
parpar-backend = { path = "../parpar-backend" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# FFI oracle only builds/links on x86_64-gnu targets (musl cross-tests
# run the native-only unit tests).
[target.'cfg(all(target_env = "gnu", target_arch = "x86_64"))'.dev-dependencies]
parpar-ffi = { path = "../parpar-ffi" }
